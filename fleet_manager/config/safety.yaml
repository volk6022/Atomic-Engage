# Ban-safety configuration (FR-145) — HOT-RELOADABLE.
#
# This file is the authoritative source for warmup schedules and per-use-case
# rate limits at runtime. Edit it and reload WITHOUT restarting the fleet:
#   - POST /v1/admin/reload-safety   (portable; any platform)
#   - kill -HUP <gateway_pid>        (POSIX only)
# If this file is absent or invalid, the fleet falls back to the code defaults in
# app/core/safety_defaults.py (identical to the values below).
#
# Warmup: per-tier `days` are the DURATION spent in that tier; the per-use-case
# total equals their sum (data-model §9 / FR-110):
#   reactions 7 · join_groups 14 · cold_dm 30 · inviting 45.
# Tier advancement uses the CUMULATIVE day budget, so `fresh` accounts emit zero
# cold messages until they reach `ready`.

warmup_schedules:
  reactions:
    total_days: 7
    tiers:
      fresh:        {days: 1, actions: [profile_setup, subscribe_channels, read]}
      basic:        {days: 2, actions: [react, read, subscribe_channels]}
      intermediate: {days: 2, actions: [react, forward, read]}
      ready:        {days: 2, actions: [react, send_message]}
  join_groups:
    total_days: 14
    tiers:
      fresh:        {days: 2, actions: [profile_setup, read]}
      basic:        {days: 4, actions: [react, read, subscribe_channels]}
      intermediate: {days: 4, actions: [join_group, react, read]}
      ready:        {days: 4, actions: [join_group, send_message]}
  cold_dm:
    total_days: 30
    tiers:
      fresh:        {days: 5, actions: [profile_setup, read, subscribe_channels]}
      basic:        {days: 8, actions: [react, read, cross_message_reply]}
      intermediate: {days: 10, actions: [cross_message_reply, react, read]}
      ready:        {days: 7, actions: [send_message, react]}
  inviting:
    total_days: 45
    tiers:
      fresh:        {days: 7, actions: [profile_setup, read, subscribe_channels]}
      basic:        {days: 12, actions: [react, cross_message_reply, read]}
      intermediate: {days: 14, actions: [join_group, react, cross_message_reply]}
      ready:        {days: 12, actions: [invite_to_group, send_message]}
  # Public replies in a channel's discussion group. Copies the join_groups ladder
  # (14 days, already run on live accounts); the only difference is that `ready` also
  # permits send_message — this use-case must keep joining new discussion groups AND
  # post in them, while join_groups only ever joins.
  # `cross_message_reply` is deliberately absent: it is a warmup-ladder word, not an
  # API action. A public reply IS send_message with reply_to_message_id.
  public_reply:
    total_days: 14
    tiers:
      fresh:        {days: 2, actions: [profile_setup, read, subscribe_channels]}
      basic:        {days: 4, actions: [react, read, subscribe_channels]}
      intermediate: {days: 4, actions: [join_group, react, read]}
      ready:        {days: 4, actions: [join_group, react, send_message]}
  # Bench profile: zero-day tiers, and every tier permits every action. A bench
  # account is created `fresh` and nothing promotes it before the first warmup_tick,
  # so a tier-gated list would refuse the very actions a bench run exists to exercise
  # (join_group came back 409 this way). Ban-safety here rests on the daily caps
  # below, not on the warmup ladder. Matches app/core/safety_defaults.py.
  service_testing:
    total_days: 0
    tiers:
      fresh:        &bench_actions
        days: 0
        actions: [profile_setup, subscribe_channels, read, forward, react, join_group, invite_to_group, cross_message_reply, send_message]
      basic:        *bench_actions
      intermediate: *bench_actions
      ready:        *bench_actions

# Per-use-case daily caps (research R5 / KB-derived; tune per cohort).
# 0 == the action is not part of that use-case's normal behaviour.
rate_limits:
  reactions:   {reactions_per_day: 50, messages_per_day: 0,  joins_per_day: 0, invites_per_day: 0,  resolves_per_day: 100}
  join_groups: {reactions_per_day: 30, messages_per_day: 0,  joins_per_day: 5, invites_per_day: 0,  resolves_per_day: 100}
  cold_dm:     {reactions_per_day: 30, messages_per_day: 20, joins_per_day: 0, invites_per_day: 0,  resolves_per_day: 100}
  inviting:    {reactions_per_day: 30, messages_per_day: 10, joins_per_day: 3, invites_per_day: 20, resolves_per_day: 100}
  # Joins are the scarcer axis (3/d, below join_groups' 5): this account also posts,
  # and "joined ten groups today" is the pattern that gets looked at. Messages are
  # half of cold_dm's 20 — a public reply carries no message-to-non-contact signal,
  # but everyone in the group sees it, so a repetitive one is easier to report.
  public_reply: {reactions_per_day: 30, messages_per_day: 10, joins_per_day: 3, invites_per_day: 0,  resolves_per_day: 100}
  # Bench profile — nominal ceilings so a budget never silently absorbs a test result.
  # Deliberately unsafe for real outreach; see UseCase.SERVICE_TESTING.
  service_testing: {reactions_per_day: 1000, messages_per_day: 1000, joins_per_day: 1000, invites_per_day: 1000, resolves_per_day: 1000}

# Per-account daily caps for READ-only research actions (docs/research-agent-actions.md
# §4.1, contract §5). Warmup-exempt (no behavioural footprint) but budgeted so a bursty
# enrichment/monitoring run can't flood the fleet. get_chat_history was raised
# 80 -> 2000: a live measurement showed ~9000 messages/day in one active discussion
# group alone, so the old cap would have taken two years to backfill a single group.
# Discovery reads sit at 50: discovery is bursty (one call per seed channel), so a
# small ceiling keeps a single enrichment run from eating the fleet's daily read
# budget. The old singular `search_public_chat` key was removed with the action it
# never had; the plural `search_public_chats` carries the cap. Matches
# app/core/safety_defaults.py.
read_limits:
  resolve_username: 100
  get_chat_info: 200
  get_chat_history: 2000
  get_similar_channels: 50
  search_public_chats: 50
  get_chat_admins: 100
  get_dialogs: 50
